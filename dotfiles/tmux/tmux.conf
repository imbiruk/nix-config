set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-c new-session

# --- terminal ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g default-shell "/run/current-system/sw/bin/bash"
set -g default-command "/run/current-system/sw/bin/nu"

# --- windows ---
bind c new-window -c "#{pane_current_path}"
bind X kill-window

# --- status ---
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#21202e,fg=#6e6a86"
set -g status-left "#[fg=#908caa] #S "
set -g status-left-length 30
set -g status-right-length 30
set -g status-right "#[fg=#6e6a86]%I:%M %p "

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#e0def4] #I:#W "

set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#403d52"

run-shell "bash $HOME/.config/tmux/plugins/tpm/tpm"
